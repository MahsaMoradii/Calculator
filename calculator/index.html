<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
      <div class="output">
          <input type="text" name="result" id="result" class="result" readonly>
      </div>
      <div>
        <input type="button" value="AC" class="operator Ac">
        <input type="button" value="DEL" class="operator Del">
        <input type="button" value="%" class="operator value asign">
        <input type="button" value="÷" class="operator value asign">
      </div>
      <div>
        <input type="button" value="7" class="value number">
        <input type="button" value="8" class="value number">
        <input type="button" value="9" class="value number">
        <input type="button" value="×" class="operator value asign">
      </div>
      <div>
        <input type="button" value="4" class="value number">
        <input type="button" value="5" class="value number">
        <input type="button" value="6" class="value number">
        <input type="button" value="-" class="operator value asign">
      </div>
      <div>
        <input type="button" value="1" class="value number">
        <input type="button" value="2" class="value number">
        <input type="button" value="3" class="value number">
        <input type="button" value="+" class="operator value asign">
      </div>
      <div>
        <input type="button" value="." class="value operator asign">
        <input type="button" value="0" class="value number">
        <input type="button" value="=" class="operator equal">
      </div>
     
    </div>
    <script src="script.js"></script>
</body>
</html>
